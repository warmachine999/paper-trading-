<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FARISTRADE X — Multi-Device Edition</title>

<style>
:root {
    --bg: #090d16;
    --panel: #111622;
    --panel-hover: #171f30;
    --border: rgba(255, 255, 255, 0.08);
    --border-focus: #4da3ff;
    --text: #f4f7fb;
    --muted: #8490a3;
    --green: #00ea80;
    --red: #ff4d6d;
    --blue: #29b6ff;
    --purple: #9b6cff;
    --yellow: #ffd166;
    --radius: 12px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

button, input, select {
    font: inherit;
    color: inherit;
    background: transparent;
    border: none;
}

button { cursor: pointer; }

.tv-app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
}

.tv-topbar {
    height: 54px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    z-index: 10;
    flex-shrink: 0;
}

.ticker-zone {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.asset-dropdown {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    outline: none;
}

.price-tracker {
    display: flex;
    flex-direction: column;
    font-size: 11px;
}
.live-price { font-weight: 700; font-variant-numeric: tabular-nums; }

.faris-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    background: rgba(255,255,255,0.03);
    padding: 4px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
}
.badge { display: flex; align-items: center; gap: 3px; font-weight: 600; }

.main-viewport {
    display: flex;
    flex: 1;
    width: 100%;
    overflow: hidden;
    position: relative;
}

.tv-left-toolbar {
    width: 44px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 10px;
    flex-shrink: 0;
}
@media (max-width: 599px) {
    .tv-left-toolbar { display: none; }
}

.tool-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    font-size: 14px;
    color: var(--muted);
    transition: 0.2s;
}
.tool-btn:hover, .tool-btn.active {
    background: var(--panel-hover);
    color: var(--text);
}

.workspace-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #0c0f1a;
}

.chart-controls {
    height: 36px;
    background: rgba(17, 22, 34, 0.6);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 4px;
}

.tf-btn {
    padding: 2px 6px;
    font-size: 10px;
    font-weight: 600;
    border-radius: 4px;
    color: var(--muted);
}
.tf-btn.active { background: rgba(255,255,255,0.08); color: var(--text); }

.chart-container {
    flex: 1;
    position: relative;
    width: 100%;
    height: 100%;
}
canvas { width: 100%; height: 100%; display: block; }

.right-sidebar {
    width: 280px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 12px;
}
@media (max-width: 991px) {
    .main-viewport { flex-direction: column; }
    .right-sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); }
}

.panel-box {
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-size: 11px;
}
</style>
</head>
<body>

<div class="tv-app">
    <!-- TOP NAVBAR -->
    <div class="tv-topbar">
        <div class="ticker-zone">
            <div class="brand-title">⚡ FARISTRADE X</div>
            <select id="assetDropdown" class="asset-dropdown">
                <option value="BTC">BTCUSD</option>
                <option value="ETH">ETHUSD</option>
                <option value="SOL">SOLUSD</option>
            </select>
            <div class="price-tracker">
                <span id="topPrice" class="live-price">$50,000.00</span>
                <span id="topChange" class="live-change green">+1.25%</span>
            </div>
        </div>
        
        <div class="faris-badges">
            <div class="badge">⚡ <span>100%</span></div>
            <div class="badge">💰 <span id="badgeCash">$100,000</span></div>
            <div class="badge">⭐ <span id="badgeXp">0 XP</span></div>
        </div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div class="main-viewport">
        <!-- LEFT TOOLBAR -->
        <div class="tv-left-toolbar">
            <button class="tool-btn active">✏️</button>
            <button class="tool-btn">📏</button>
            <button class="tool-btn">🔍</button>
        </div>

        <!-- CENTER WORKSPACE -->
        <div class="workspace-center">
            <div class="chart-controls">
                <button class="tf-btn active">1M</button>
                <button class="tf-btn">5M</button>
                <button class="tf-btn">1H</button>
                <button class="tf-btn">1D</button>
            </div>
            <div class="chart-container">
                <canvas id="mainCanvas"></canvas>
            </div>
        </div>

        <!-- RIGHT SIDEBAR -->
        <div class="right-sidebar">
            <div class="panel-box">
                <strong>Dashboard Panel</strong>
                <p style="color: var(--muted); margin-top: 6px;">Workspace metrics and configuration settings.</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Canvas Initialization & Dynamic Resize Handler
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        drawSampleGrid();
    }

    function drawSampleGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw background grid lines
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;

        const gridSize = 40;
        for (let x = 0; x < canvas.width; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }

        // Visual Placeholder Text
        ctx.fillStyle = '#8490a3';
        ctx.font = '12px sans-serif';
        ctx.fillText('Canvas Workspace Ready', 20, 30);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
</script>

</body>
</html>
