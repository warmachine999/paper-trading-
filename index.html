<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FARISTRADE X — Caramel & Tech Edition</title>

<style>
:root {
    --bg: #0a0a0c;
    --panel: #141418;
    --panel-hover: #1e1e24;
    --border: rgba(212, 163, 89, 0.15);
    --border-focus: #d4a359;
    --text: #f0e6d2;
    --muted: #8c8275;
    
    /* Caramel & Tech Palette */
    --accent: #d4a359;
    --accent-light: #f3c882;
    --green: #4ade80;
    --red: #f87171;
    --tech-gray: #26262e;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

button, select {
    font: inherit;
    color: inherit;
    background: transparent;
    border: none;
    cursor: pointer;
}

.tv-app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
}

/* TOP NAVBAR */
.tv-topbar {
    height: 54px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    z-index: 10;
    flex-shrink: 0;
}

.ticker-zone {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--accent);
}

.asset-dropdown {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--accent-light);
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    outline: none;
}

.price-tracker {
    display: flex;
    flex-direction: column;
    font-size: 11px;
}
.live-price { font-weight: 700; color: var(--text); }
.live-change { font-size: 10px; color: var(--green); }

.faris-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    background: var(--tech-gray);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
}
.badge { display: flex; align-items: center; gap: 4px; font-weight: 600; color: var(--accent); }

/* MAIN WORKSPACE */
.main-viewport {
    display: flex;
    flex: 1;
    width: 100%;
    overflow: hidden;
}

.tv-left-toolbar {
    width: 44px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 10px;
}

.tool-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    font-size: 13px;
    color: var(--muted);
    transition: 0.2s;
}
.tool-btn:hover, .tool-btn.active {
    background: var(--tech-gray);
    color: var(--accent);
}

.workspace-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #070708;
}

.chart-controls {
    height: 38px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 6px;
}

.tf-btn {
    padding: 4px 8px;
    font-size: 10px;
    font-weight: 700;
    border-radius: 4px;
    color: var(--muted);
    border: 1px solid transparent;
}
.tf-btn.active {
    background: var(--bg);
    color: var(--accent);
    border-color: var(--border);
}

.chart-container {
    flex: 1;
    position: relative;
    width: 100%;
    height: 100%;
}
canvas { width: 100%; height: 100%; display: block; }

.right-sidebar {
    width: 260px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 12px;
}
</style>
</head>
<body>

<div class="tv-app">
    <!-- TOP NAVBAR -->
    <div class="tv-topbar">
        <div class="ticker-zone">
            <div class="brand-title">⚡ FARISTRADE X</div>
            <select id="assetDropdown" class="asset-dropdown">
                <option value="BTC">BTCUSD</option>
                <option value="ETH">ETHUSD</option>
                <option value="SOL">SOLUSD</option>
            </select>
            <div class="price-tracker">
                <span id="topPrice" class="live-price">$64,280.00</span>
                <span id="topChange" class="live-change">+2.45%</span>
            </div>
        </div>
        
        <div class="faris-badges">
            <div class="badge">⚡ <span>100%</span></div>
            <div class="badge">💰 <span id="badgeCash">$100,000</span></div>
            <div class="badge">⭐ <span id="badgeXp">0 XP</span></div>
        </div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div class="main-viewport">
        <div class="tv-left-toolbar">
            <button class="tool-btn active">✏️</button>
            <button class="tool-btn">📏</button>
            <button class="tool-btn">🔍</button>
        </div>

        <div class="workspace-center">
            <div class="chart-controls">
                <button class="tf-btn active" onclick="setTimeframe('1M', this)">1M</button>
                <button class="tf-btn" onclick="setTimeframe('5M', this)">5M</button>
                <button class="tf-btn" onclick="setTimeframe('1H', this)">1H</button>
                <button class="tf-btn" onclick="setTimeframe('1D', this)">1D</button>
            </div>
            <div class="chart-container">
                <canvas id="mainCanvas"></canvas>
            </div>
        </div>

        <div class="right-sidebar">
            <div style="font-size: 11px; color: var(--muted);">
                <strong style="color: var(--accent);">Caramel & Tech Engine</strong>
                <p style="margin-top: 8px; line-height: 1.4;">Active chart rendering candlesticks, live horizontal price tracker, volume sub-bars, and 1-second interval price ticks.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const topPriceEl = document.getElementById('topPrice');

    let currentTF = '1M';
    let candleData = [];
    let livePrice = 64280.00;
    let liveTimer = null;

    // Generate random candlestick dataset with volume metrics
    function generateCandles(timeframe) {
        candleData = [];
        let basePrice = livePrice;
        let count = timeframe === '1M' ? 40 : timeframe === '5M' ? 30 : timeframe === '1H' ? 24 : 15;
        let volatility = timeframe === '1M' ? 40 : timeframe === '5M' ? 80 : timeframe === '1H' ? 200 : 500;

        for (let i = 0; i < count; i++) {
            let open = basePrice + (Math.random() - 0.48) * volatility;
            let close = open + (Math.random() - 0.48) * volatility;
            let high = Math.max(open, close) + Math.random() * (volatility * 0.3);
            let low = Math.min(open, close) - Math.random() * (volatility * 0.3);
            let volume = Math.floor(Math.random() * 80) + 20;
            
            candleData.push({ open, high, low, close, volume });
            basePrice = close;
        }
        
        livePrice = candleData[candleData.length - 1].close;
        updatePriceDisplay();
    }

    function updatePriceDisplay() {
        topPriceEl.innerText = `$${livePrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    function setTimeframe(tf, btn) {
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTF = tf;
        generateCandles(tf);
        drawChart();
    }

    // Real-Time Tick Engine (Runs every 1 second)
    function startLiveTicks() {
        if (liveTimer) clearInterval(liveTimer);

        liveTimer = setInterval(() => {
            if (candleData.length === 0) return;

            let lastCandle = candleData[candleData.length - 1];
            
            let tickChange = (Math.random() - 0.49) * 30;
            livePrice += tickChange;

            lastCandle.close = livePrice;
            if (livePrice > lastCandle.high) lastCandle.high = livePrice;
            if (livePrice < lastCandle.low) lastCandle.low = livePrice;
            lastCandle.volume += Math.floor(Math.random() * 3) + 1;

            updatePriceDisplay();
            drawChart();
        }, 1000);
    }

    function drawChart() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Grid lines
        ctx.strokeStyle = 'rgba(212, 163, 89, 0.05)';
        ctx.lineWidth = 1;
        ctx.setLineDash([]);
        for (let x = 0; x < canvas.width; x += 50) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        if (candleData.length === 0) return;

        // Scale bounds (leaving bottom 20% for volume)
        let prices = candleData.flatMap(c => [c.high, c.low]);
        let minP = Math.min(...prices);
        let maxP = Math.max(...prices);
        let volumes = candleData.map(c => c.volume);
        let maxVol = Math.max(...volumes);

        let topPadding = 30;
        let bottomPadding = canvas.height * 0.22;
        let chartHeight = canvas.height - topPadding - bottomPadding;

        function getY(price) {
            return canvas.height - bottomPadding - ((price - minP) / (maxP - minP)) * chartHeight;
        }

        let candleWidth = (canvas.width - 80) / candleData.length;

        // Draw Volume & Candlesticks
        candleData.forEach((c, i) => {
            let x = 40 + i * candleWidth + candleWidth / 2;
            let openY = getY(c.open);
            let closeY = getY(c.close);
            let highY = getY(c.high);
            let lowY = getY(c.low);

            let isGreen = c.close >= c.open;
            let color = isGreen ? '#4ade80' : '#f87171';

            // Volume Bars
            let volHeight = (c.volume / maxVol) * (canvas.height * 0.16);
            ctx.fillStyle = isGreen ? 'rgba(74, 222, 128, 0.25)' : 'rgba(248, 113, 113, 0.25)';
            ctx.fillRect(x - candleWidth * 0.35, canvas.height - volHeight - 10, candleWidth * 0.7, volHeight);

            // Candle Wick
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x, highY);
            ctx.lineTo(x, lowY);
            ctx.stroke();

            // Candle Body
            ctx.fillStyle = color;
            let bodyY = Math.min(openY, closeY);
            let bodyHeight = Math.max(Math.abs(closeY - openY), 2);
            ctx.fillRect(x - candleWidth * 0.3, bodyY, candleWidth * 0.6, bodyHeight);
        });

        // Live Price Horizontal Tracking Line
        let lastCandle = candleData[candleData.length - 1];
        let liveY = getY(livePrice);
        let isBullish = lastCandle.close >= lastCandle.open;
        let lineAccentColor = isBullish ? '#4ade80' : '#f87171';

        ctx.strokeStyle = lineAccentColor;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(0, liveY);
        ctx.lineTo(canvas.width - 70, liveY);
        ctx.stroke();
        ctx.setLineDash([]);

        // Right Margin Price Badge
        let badgeWidth = 65;
        let badgeHeight = 18;
        let badgeX = canvas.width - 68;
        let badgeY = liveY - badgeHeight / 2;

        ctx.fillStyle = lineAccentColor;
        ctx.fillRect(badgeX, badgeY, badgeWidth, badgeHeight);

        ctx.fillStyle = '#0a0a0c';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(livePrice.toFixed(1), badgeX + badgeWidth / 2, liveY);
    }

    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        drawChart();
    }

    window.addEventListener('resize', resizeCanvas);
    
    // Initialize
    generateCandles('1M');
    resizeCanvas();
    startLiveTicks();
</script>

</body>
                    </html>
